# Sorcha config - NEOMOD3/S3M TEST (Phase 2 run config)
# ============================================================================
# Physics is IDENTICAL to s3m_case1_tk1_sep05.ini. The ONLY difference is that
# [LINKINGFILTER] is NOT applied by this run.
#
# WHY: sorcha.py:343 does `observations = PPLinkingFilter(...)`, which REPLACES
# the observations table with linked rows only. Running with [LINKINGFILTER]
# destroys the unlinked detections, and the requirement is to preserve ALL raw
# detections before the linking filter.
#
# Case1 (SSP_number_tracklets=1, SSP_separation_threshold=0.5) remains the SOLE
# compatibility selection. It is applied DOWNSTREAM to these raw detections, so
# the primary and case1 products share ONE detection realization. Running Sorcha
# twice would give them different stochastic fading/efficiency draws.
# Case1 parameters are preserved verbatim below and in
# neomod3_test_case1_linking.json.
# ============================================================================

[INPUT]
ephemerides_type = ar
eph_format = csv
size_serial_chunk = 20000
aux_format = csv
pointing_sql_query = SELECT observationId, observationStartMJD as observationStartMJD_TAI, visitTime, visitExposureTime, filter, seeingFwhmGeom as seeingFwhmGeom_arcsec, seeingFwhmEff as seeingFwhmEff_arcsec, fiveSigmaDepth as fieldFiveSigmaDepth_mag , fieldRA as fieldRA_deg, fieldDec as fieldDec_deg, rotSkyPos as fieldRotSkyPos_deg FROM observations order by observationId


[SIMULATION]
ar_ang_fov = 2.06
ar_fov_buffer = 0.2
ar_picket = 1
ar_obs_code = X05
ar_healpix_order = 6


[FILTERS]
observing_filters = r,g,i,z,u,y


[SATURATION]
bright_limit = 16.0


[PHASECURVES]
phase_function = HG


[FOV]
camera_model = footprint
footprint_edge_threshold = 2.


[FADINGFUNCTION]
fading_function_width = 0.1
fading_function_peak_efficiency = 1.


[OUTPUT]
output_format = hdf5
output_columns = all


[LIGHTCURVE]
lc_model = none


[ACTIVITY]
comet_activity = none

# ---------------------------------------------------------------------------
# CASE1 LINKING PARAMETERS - applied downstream, NOT by this run:
#   SSP_detection_efficiency = 0.95
#   SSP_number_observations = 2
#   SSP_separation_threshold = 0.5
#   SSP_maximum_time = 0.0625
#   SSP_number_tracklets = 1
#   SSP_track_window = 15
#   SSP_night_start_utc = 16.0
