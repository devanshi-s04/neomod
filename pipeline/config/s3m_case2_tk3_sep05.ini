# Sorcha config — S3M LINKING EXPERIMENT, CASE 2
# ============================================================================
# ONLY two parameters differ across the three case configs:
#     SSP_number_tracklets      (case1=1, case2=3, case3=1)
#     SSP_separation_threshold  (case1=0.5, case2=0.5, case3=0.001)
# Everything else is identical across s3m_case1/2/3 and matches the base
# Rubin_full_footprint_detections.ini used for the original production run,
# with a [LINKINGFILTER] section added so Sorcha applies SSP linking natively.
# Output stays hdf5 / all so sorcha_postprocess.py can read the rate columns.
# ============================================================================

[INPUT]
ephemerides_type = ar
eph_format = csv
size_serial_chunk = 20000
aux_format = csv
pointing_sql_query = SELECT observationId, observationStartMJD as observationStartMJD_TAI, visitTime, visitExposureTime, filter, seeingFwhmGeom as seeingFwhmGeom_arcsec, seeingFwhmEff as seeingFwhmEff_arcsec, fiveSigmaDepth as fieldFiveSigmaDepth_mag , fieldRA as fieldRA_deg, fieldDec as fieldDec_deg, rotSkyPos as fieldRotSkyPos_deg FROM observations order by observationId


[SIMULATION]
ar_ang_fov = 2.06
ar_fov_buffer = 0.2
ar_picket = 1
ar_obs_code = X05
ar_healpix_order = 6


[FILTERS]
observing_filters = r,g,i,z,u,y


[SATURATION]
bright_limit = 16.0


[PHASECURVES]
phase_function = HG


[FOV]
camera_model = footprint
footprint_edge_threshold = 2.


[FADINGFUNCTION]
fading_function_width = 0.1
fading_function_peak_efficiency = 1.


[LINKINGFILTER]
# SSP detection efficiency (fraction of linkable objects SSP successfully links).
SSP_detection_efficiency = 0.95

# Detections per night required to form a nightly tracklet.
SSP_number_observations = 2

# --- CASE-VARYING PARAMETER 1 ---
# Minimum inter-detection angular separation (arcsec) to count as motion.
SSP_separation_threshold = 0.5

# Maximum time between detections in a tracklet (days). 0.0625 d = 90 min.
SSP_maximum_time = 0.0625

# --- CASE-VARYING PARAMETER 2 ---
# Number of nightly tracklets required to classify an object as detected.
SSP_number_tracklets = 3

# The tracklets above must occur within this many days.
SSP_track_window = 15

# UTC hour of local noon at the observatory (Rubin: 16.0).
SSP_night_start_utc = 16.0


[OUTPUT]
output_format = hdf5
output_columns = all


[LIGHTCURVE]
lc_model = none


[ACTIVITY]
comet_activity = none
